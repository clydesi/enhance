<!--
Clyde artifact: Dashboard. Copyright 2026 Clyde Intelligence, LLC. SPDX-License-Identifier: Apache-2.0
Version: 0.1.0
Transactions, Accounts, and Spending in three tabs: every transaction by month, with
search, sorting by any column, the pending block, and each row opened in place to edit its payee, category, tags, and
note; net worth and every account by owner; and a month's spending, twelve months as a chart, by category. Its link can
name the tab and what it shows (#tab=transactions&account=acct_1). It reads the ledger through the Clyde connector when
it opens, when the user asks it for more, and when the ledger has changed (a small check when the user comes back to it,
and every half minute while it is in sight), and changes it only when the user saves a transaction.
Connector tools: show_transactions, show_accounts, show_spending, edit
-->
